[project]
name = "noise-segmentation-autolabeler"
version = "0.1.0"
description = "HL320 point-wise LiDAR and camera teacher segmentation toolkit"
requires-python = ">=3.10"
dependencies = ["numpy>=1.25"]

[project.optional-dependencies]
visualization = ["pyvista>=0.43"]
camera = ["opencv-contrib-python>=4.8"]

[tool.pytest.ini_options]
pythonpath = ["src"]
