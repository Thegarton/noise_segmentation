[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hl320-sign-type-classifier"
version = "0.1.0"
description = "SAM3-assisted HL320 traffic sign type dataset tools"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.25",
  "opencv-contrib-python>=4.8",
  "Pillow>=10.0",
]

[project.optional-dependencies]
training = [
  "torch>=2.1",
  "torchvision>=0.16",
]

[tool.setuptools.packages.find]
where = ["src"]
